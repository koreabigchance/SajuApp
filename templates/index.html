<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연서무당 (Yeonseo Mudang) - 20년차 민신 MZ 인사의 신묘한 결</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        // 카카오톡 인앱 브라우저 감지 시 외부 브라우저(Safari/Chrome)로 강제 이동
        if (navigator.userAgent.toLowerCase().indexOf('kakaotalk') > -1) {
            location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href);
        }
    </script>
    <style>
        /* Intro Overlay */
        #intro-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            transition: opacity 1s ease, visibility 1s ease;
        }
        #intro-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; display: none;
        }
        #intro-btn {
            position: relative; z-index: 10000; padding: 15px 40px;
            font-size: 1.2rem; font-weight: bold; color: #fceeb5;
            background: rgba(30, 20, 50, 0.8); border: 2px solid #c29d59;
            border-radius: 30px; cursor: pointer;
            box-shadow: 0 0 20px rgba(194, 157, 89, 0.5);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(194, 157, 89, 0.5); }
            50% { transform: scale(1.05); box-shadow: 0 0 35px rgba(194, 157, 89, 0.9); }
            100% { transform: scale(1); box-shadow: 0 0 20px rgba(194, 157, 89, 0.5); }
        }
    </style>
</head>
<body>
    <!-- Intro Overlay -->
    <div id="intro-overlay">
        <video id="intro-video" playsinline preload="auto">
            <source src="{{ url_for('static', filename='intro.mp4') }}" type="video/mp4">
        </video>
        <button id="intro-btn">터치하여 입장하기</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const overlay = document.getElementById('intro-overlay');
            const video = document.getElementById('intro-video');
            const btn = document.getElementById('intro-btn');
            
            // 이미 영상을 봤는지 세션 체크 (새로고침 시 매번 나오는 것 방지)
            if (sessionStorage.getItem('introWatched')) {
                overlay.style.display = 'none';
                return;
            }
            
            btn.addEventListener('click', () => {
                btn.style.display = 'none';
                video.style.display = 'block';
                // 볼륨을 켜서 재생 (모바일 정책 허용 - 사용자 클릭에 의한 재생)
                video.muted = false;
                video.play().catch(e => {
                    console.error("비디오 재생 실패", e);
                    skipIntro(); // 재생 실패 시 강제 스킵하여 메인 화면으로 이동
                });
            });
            
            video.addEventListener('ended', skipIntro);
            video.addEventListener('click', skipIntro); // 영상 재생 중 터치 시 스킵
            
            function skipIntro() {
                sessionStorage.setItem('introWatched', 'true');
                overlay.style.opacity = '0';
                overlay.style.visibility = 'hidden';
                setTimeout(() => overlay.remove(), 1000); // 1초 뒤 완전히 DOM에서 제거
            }
        });
    </script>

    <div class="container" style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
        <div class="glass-card fade-in" style="width: 100%; max-width: 480px; position: relative; overflow: hidden;">
            
            <div style="text-align: center; margin-bottom: 2.5rem;">
                <!-- 달 모양 아이콘 (이미지에 있는 상단 달 장식 느낌) -->
                <div style="display: inline-flex; align-items: center; justify-content: center; width: 70px; height: 70px; border-radius: 50%; background: linear-gradient(135deg, rgba(30,20,50,0.8), rgba(60,30,80,0.8)); border: 2px solid rgba(194, 157, 89, 0.4); box-shadow: 0 0 20px rgba(194, 157, 89, 0.3); margin-bottom: 1.5rem; position: relative; margin-top: -1rem;">
                    <i class="fa-solid fa-moon" style="font-size: 2rem; color: #fceeb5; text-shadow: 0 0 10px rgba(252,238,181,0.8);"></i>
                    <i class="fa-solid fa-star" style="font-size: 0.6rem; color: #fceeb5; position: absolute; top: 15px; right: 15px;"></i>
                </div>
                
                <h1 class="neon-text" style="font-size: 2.2rem; font-weight: 800; margin-bottom: 0.8rem; letter-spacing: 1px; display: flex; flex-direction: column; align-items: center; gap: 0.3rem;">
                    <span>연서무당</span>
                    <span style="font-size: 1.2rem; font-weight: 400; opacity: 0.8; text-shadow: none; color: #f0e6fa;">(Yeonseo Mudang)</span>
                </h1>
                <p style="color: #1a1025; background: linear-gradient(135deg, #fceeb5 0%, #c29d59 100%); display: inline-block; padding: 0.4rem 1.2rem; border-radius: 30px; font-size: 1.1rem; font-weight: 800; letter-spacing: 1px; box-shadow: 0 0 20px rgba(194, 157, 89, 0.5); margin-bottom: 1rem;">MZ 20년차 만신</p>
            </div>
            
            <form action="/loading" method="POST">
                <div class="form-group">
                    <label for="name">성함</label>
                    <div style="position: relative;">
                        <i class="fa-regular fa-user" style="position: absolute; left: 1.2rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                        <input type="text" id="name" name="name" required placeholder="이름을 입력하세요" autocomplete="name" style="padding-left: 3rem;">
                    </div>
                </div>
                
                <div class="form-group">
                    <label>성별</label>
                    <div style="display: flex; gap: 1rem;">
                        <label style="flex: 1; position: relative; cursor: pointer;">
                            <input type="radio" name="gender" value="male" checked style="display: none;">
                            <div class="gender-btn" style="padding:1rem; text-align:center; background:rgba(10,5,20,0.6); border:1px solid rgba(255,255,255,0.1); border-radius:12px; font-weight:500; color:var(--text-muted); transition:all 0.3s ease;">남성</div>
                        </label>
                        <label style="flex: 1; position: relative; cursor: pointer;">
                            <input type="radio" name="gender" value="female" style="display: none;">
                            <div class="gender-btn" style="padding:1rem; text-align:center; background:rgba(10,5,20,0.6); border:1px solid rgba(255,255,255,0.1); border-radius:12px; font-weight:500; color:var(--text-muted); transition:all 0.3s ease;">여성</div>
                        </label>
                    </div>
                </div>
                
                <style>
                    input[type="radio"]:checked + .gender-btn { 
                        background: linear-gradient(135deg, rgba(139,92,246,0.3) 0%, rgba(91,33,182,0.3) 100%) !important; 
                        color: #fceeb5 !important; 
                        border-color: rgba(194,157,89,0.5) !important;
                        box-shadow: 0 0 15px rgba(139,92,246,0.2);
                    }
                </style>

                <div class="form-group">
                    <label for="birth_date">생년월일(양력)</label>
                    <div style="position: relative;">
                        <i class="fa-regular fa-calendar" style="position: absolute; left: 1.2rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); z-index: 1;"></i>
                        <input type="date" id="birth_date" name="birth_date" required style="padding-left: 3rem;">
                    </div>
                </div>
                
                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                        <label for="birth_time" style="margin-bottom: 0;">태어난 시간</label>
                        <label style="font-size: 0.85rem; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; gap: 5px;">
                            <input type="checkbox" id="unknown_time" name="unknown_time" value="true" onchange="toggleTimeInput()"> 태어난 시간을 모름
                        </label>
                    </div>
                    <div style="position: relative;">
                        <i class="fa-regular fa-clock" style="position: absolute; left: 1.2rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); z-index: 1;"></i>
                        <input type="time" id="birth_time" name="birth_time" required style="padding-left: 3rem; transition: opacity 0.3s;">
                    </div>
                </div>
                
                <script>
                    function toggleTimeInput() {
                        const timeInput = document.getElementById('birth_time');
                        const isUnknown = document.getElementById('unknown_time').checked;
                        if (isUnknown) {
                            timeInput.value = "12:00"; // 기본 오시(午時)로 설정
                            timeInput.style.opacity = "0.4";
                            timeInput.style.pointerEvents = "none";
                        } else {
                            timeInput.value = "";
                            timeInput.style.opacity = "1";
                            timeInput.style.pointerEvents = "auto";
                        }
                    }
                </script>
                
                <button type="submit" class="btn-primary" style="margin-top: 1.5rem;">
                    운세 확인하기
                </button>
            </form>
        </div>
    </div>
</body>
</html>
