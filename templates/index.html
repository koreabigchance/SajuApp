<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연서무당 (Yeonseo Mudang) - 20년차 민신 MZ 인사의 신묘한 결</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        // 카카오톡 인앱 브라우저 감지 시 외부 브라우저(Safari/Chrome)로 강제 이동
        if (navigator.userAgent.toLowerCase().indexOf('kakaotalk') > -1) {
            location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href);
        }
    </script>
</head>
<body>
    <div class="container" style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
        <div class="glass-card fade-in" style="width: 100%; max-width: 480px; position: relative; overflow: hidden;">
            
            <div style="text-align: center; margin-bottom: 2.5rem;">
                <!-- 달 모양 아이콘 (이미지에 있는 상단 달 장식 느낌) -->
                <div style="display: inline-flex; align-items: center; justify-content: center; width: 70px; height: 70px; border-radius: 50%; background: linear-gradient(135deg, rgba(30,20,50,0.8), rgba(60,30,80,0.8)); border: 2px solid rgba(194, 157, 89, 0.4); box-shadow: 0 0 20px rgba(194, 157, 89, 0.3); margin-bottom: 1.5rem; position: relative; margin-top: -1rem;">
                    <i class="fa-solid fa-moon" style="font-size: 2rem; color: #fceeb5; text-shadow: 0 0 10px rgba(252,238,181,0.8);"></i>
                    <i class="fa-solid fa-star" style="font-size: 0.6rem; color: #fceeb5; position: absolute; top: 15px; right: 15px;"></i>
                </div>
                
                <h1 class="neon-text" style="font-size: 2.2rem; font-weight: 800; margin-bottom: 0.8rem; letter-spacing: 1px;">연서무당 <span style="font-size: 1.2rem; font-weight: 400; opacity: 0.8; text-shadow: none; color: #f0e6fa;">(Yeonseo Mudang)</span></h1>
                <p style="color: #1a1025; background: linear-gradient(135deg, #fceeb5 0%, #c29d59 100%); display: inline-block; padding: 0.4rem 1.2rem; border-radius: 30px; font-size: 1.1rem; font-weight: 800; letter-spacing: 1px; box-shadow: 0 0 20px rgba(194, 157, 89, 0.5); margin-bottom: 1rem;">MZ 20년차 만신</p>
            </div>
            
            <form action="/loading" method="POST">
                <div class="form-group">
                    <label for="name">성함</label>
                    <div style="position: relative;">
                        <i class="fa-regular fa-user" style="position: absolute; left: 1.2rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                        <input type="text" id="name" name="name" required placeholder="이름을 입력하세요" autocomplete="name" style="padding-left: 3rem;">
                    </div>
                </div>
                
                <div class="form-group">
                    <label>성별</label>
                    <div style="display: flex; gap: 1rem;">
                        <label style="flex: 1; position: relative; cursor: pointer;">
                            <input type="radio" name="gender" value="male" checked style="display: none;">
                            <div class="gender-btn" style="padding:1rem; text-align:center; background:rgba(10,5,20,0.6); border:1px solid rgba(255,255,255,0.1); border-radius:12px; font-weight:500; color:var(--text-muted); transition:all 0.3s ease;">남성</div>
                        </label>
                        <label style="flex: 1; position: relative; cursor: pointer;">
                            <input type="radio" name="gender" value="female" style="display: none;">
                            <div class="gender-btn" style="padding:1rem; text-align:center; background:rgba(10,5,20,0.6); border:1px solid rgba(255,255,255,0.1); border-radius:12px; font-weight:500; color:var(--text-muted); transition:all 0.3s ease;">여성</div>
                        </label>
                    </div>
                </div>
                
                <style>
                    input[type="radio"]:checked + .gender-btn { 
                        background: linear-gradient(135deg, rgba(139,92,246,0.3) 0%, rgba(91,33,182,0.3) 100%) !important; 
                        color: #fceeb5 !important; 
                        border-color: rgba(194,157,89,0.5) !important;
                        box-shadow: 0 0 15px rgba(139,92,246,0.2);
                    }
                </style>

                <div class="form-group">
                    <label for="birth_date">생년월일(양력)</label>
                    <div style="position: relative;">
                        <i class="fa-regular fa-calendar" style="position: absolute; left: 1.2rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); z-index: 1;"></i>
                        <input type="date" id="birth_date" name="birth_date" required style="padding-left: 3rem;">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="birth_time">태어난 시간</label>
                    <div style="position: relative;">
                        <i class="fa-regular fa-clock" style="position: absolute; left: 1.2rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); z-index: 1;"></i>
                        <input type="time" id="birth_time" name="birth_time" required style="padding-left: 3rem;">
                    </div>
                </div>
                
                <button type="submit" class="btn-primary" style="margin-top: 1.5rem;">
                    운세 확인하기
                </button>
            </form>
        </div>
    </div>
</body>
</html>
